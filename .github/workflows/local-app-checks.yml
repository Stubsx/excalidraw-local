name: Desktop app checks
on:
  push:
    branches: [local-app]
    paths:
      [
        "local-app/**",
        "packages/**",
        "package.json",
        "yarn.lock",
        ".github/workflows/local-app-*.yml",
      ]
  pull_request:
    paths:
      [
        "local-app/**",
        "packages/**",
        "package.json",
        "yarn.lock",
        ".github/workflows/local-app-*.yml",
      ]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-app/src-tauri
      - run: yarn install --frozen-lockfile
      - run: yarn test:typecheck
      - run: yarn test:app --watch=false
      - run: yarn workspace excalidraw-local typecheck
      - run: yarn workspace excalidraw-local test
      - run: yarn workspace excalidraw-local test:cli
      - run: node local-app/scripts/prepare-runtime.mjs
      - run: cargo test --locked --manifest-path local-app/src-tauri/Cargo.toml
