name: Signed macOS release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !contains(github.ref_name, 'preview') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    environment: macos-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-app/src-tauri
      - run: yarn install --frozen-lockfile
      - name: Validate release tag and signing inputs
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" && test -n "$SIGNING_IDENTITY" && test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_PASSWORD"
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./local-app/package.json").version')"
      - name: Import the fixed Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/release.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db" login.keychain-db
          xcrun notarytool store-credentials excal-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$RUNNER_TEMP/release.keychain-db"
      - name: Build, sign, notarize and package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_PROFILE: excal-release
          APPLE_NOTARY_KEYCHAIN: ${{ runner.temp }}/release.keychain-db
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn workspace excalidraw-local release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: local-app/dist-release/*/signed/${{ matrix.arch }}/*
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish both architectures after all builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat release-assets/macos-*/SHA256SUMS > release-assets/SHA256SUMS
          cp release-assets/macos-arm64/release.json release-assets/release-arm64.json
          cp release-assets/macos-x64/release.json release-assets/release-x64.json
          node local-app/scripts/merge-updates.mjs release-assets/latest.json release-assets/macos-*/latest.json
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release-assets/macos-*/*.dmg release-assets/macos-*/*.app.tar.gz release-assets/macos-*/*.sig release-assets/latest.json release-assets/SHA256SUMS release-assets/release-*.json --verify-tag --title "Excalidraw Local $GITHUB_REF_NAME" --generate-notes
