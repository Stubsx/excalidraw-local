[package]
name = "excalidraw-local"
version = "0.2.5"
description = "Local-first Excalidraw desktop app with file management and Agent CLI"
authors = ["jabber1"]
edition = "2021"
rust-version = "1.77"

# The library is the real app (Tauri 2.x convention); main.rs is a thin shim.
[lib]
name = "excalidraw_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.6", features = [] }
tauri-plugin-sql = { version = "2.4", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local IPC server (CLI -> axum -> emit -> webview) for the render command.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
tauri-plugin-fs = "2.0.0-rc.6"
tauri-plugin-dialog = "2.0.0-rc.8"

# CLI install feature: resolving home dir / standard bin paths.
dirs = "5"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[features]
# This enables the custom protocol in release builds.
custom-protocol = ["tauri/custom-protocol"]
